<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>—</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0A09;
  --ink-2:#131110;
  --chalk:#EBE5D9;
  --dim:#7E7669;
  --faint:#302B24;
  --glow:#B8874A;
  --serif:"Spectral",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--chalk);
  font-family:var(--serif);
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
#glow{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 50% at 50% 42%,rgba(184,135,74,.10),transparent 70%);
  opacity:0;transition:opacity 3s ease;
}
#glow.on{opacity:1}
#stage{
  position:relative;z-index:1;
  height:100%;
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(1.6rem,5vw,5rem);
  max-width:56rem;
}
.line{
  font-size:clamp(1.35rem,2.6vw,1.9rem);
  line-height:1.55;
  max-width:32ch;
  opacity:0;transform:translateY(10px);
  transition:opacity 1.4s ease,transform 1.4s ease;
}
.line.in{opacity:1;transform:none}
.line em{font-style:italic;color:var(--dim)}
.sub{
  font-size:clamp(1rem,1.5vw,1.12rem);
  color:var(--dim);
  max-width:38ch;
  margin-top:1.6rem;
  line-height:1.7;
  opacity:0;transform:translateY(8px);
  transition:opacity 1.4s ease .4s,transform 1.4s ease .4s;
}
.sub.in{opacity:1;transform:none}
#mots{display:flex;flex-wrap:wrap;gap:.9rem 2.4rem;margin-top:3.2rem;max-width:40rem}
.mot{
  background:none;border:0;padding:0 0 .3rem;
  font-family:var(--serif);font-weight:300;
  font-size:clamp(1.1rem,2vw,1.4rem);
  color:var(--dim);
  cursor:pointer;
  border-bottom:1px solid transparent;
  opacity:0;transform:translateY(6px);
  transition:opacity 1.1s ease,transform 1.1s ease,color .5s ease,border-color .5s ease;
}
.mot.in{opacity:1;transform:none}
.mot:hover,.mot:focus-visible{color:var(--chalk);border-bottom-color:var(--faint);outline:none}
#trace{
  position:fixed;left:clamp(1.6rem,5vw,5rem);bottom:2.2rem;z-index:2;
  font-family:var(--mono);font-size:11px;font-weight:300;
  letter-spacing:.16em;color:#5C554B;
  text-transform:lowercase;
  max-width:70vw;line-height:2;
  transition:color 1.2s ease;
}
#porte{
  position:fixed;right:clamp(1.6rem,5vw,5rem);bottom:2.2rem;z-index:2;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  color:#4A443B;text-decoration:none;
  border-bottom:1px solid transparent;
  transition:color .5s,border-color .5s,opacity 1.5s;
  opacity:0;
}
#porte.in{opacity:1}
#porte:hover{color:var(--dim);border-bottom-color:var(--faint)}
#pousser{
  align-self:flex-start;
  margin-top:0;
  background:none;border:0;padding:0;cursor:pointer;
  font-family:var(--mono);font-size:12px;letter-spacing:.34em;
  color:var(--dim);text-transform:uppercase;
}
#barre{
  margin-top:1.1rem;width:16rem;max-width:60vw;height:1px;background:var(--faint);
  position:relative;
}
#barre i{position:absolute;inset:0 auto 0 0;width:0;background:var(--chalk);display:block}
#amorce{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:.6rem;
  margin-top:2.6rem;width:100%;
}
#prefixe{
  font-family:var(--serif);font-weight:300;font-size:1.3rem;color:var(--dim);
  white-space:nowrap;
}
#champ{
  flex:1 1 14rem;min-width:12rem;
  background:none;border:0;border-bottom:1px solid var(--faint);
  font-family:var(--serif);font-weight:300;font-size:1.3rem;
  color:var(--chalk);padding:.4rem 0;
}
#champ:focus{outline:none;border-bottom-color:var(--dim)}
#champ::placeholder{color:#3E382F}
#err{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:#8A6A4A;margin-top:.9rem;height:1em}
.envers{
  margin-top:2rem;font-size:1rem;color:var(--dim);max-width:36ch;line-height:1.75;
  opacity:0;transition:opacity 1.6s ease 1s;
}
.envers.in{opacity:1}
#sortiePorte{
  display:inline-block;margin-top:2.6rem;
  font-family:var(--serif);font-size:1.25rem;color:var(--chalk);
  text-decoration:none;border-bottom:1px solid var(--faint);padding-bottom:.25rem;
  opacity:0;transition:opacity 1.6s ease 2s,border-color .5s;
}
#sortiePorte.in{opacity:1}
#sortiePorte:hover{border-bottom-color:var(--chalk)}
#signature{
  margin-top:3.4rem;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  color:#5C554B;line-height:2.1;max-width:44ch;
  opacity:0;transition:opacity 2s ease 3s;
}
#signature.in{opacity:1}
#reprendre{
  background:none;border:0;padding:0;margin-top:2rem;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#403A32;
  opacity:0;transition:opacity 2s ease 4s,color .4s;
}
#reprendre.in{opacity:1}
#reprendre:hover{color:var(--dim)}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="glow"></div>
<div id="stage">
  <p class="line" id="l1"></p>
  <p class="sub" id="l2"></p>
  <div id="mots"></div>
</div>
<div id="trace"></div>
<a id="porte" href="index.html">entrer directement</a>

<script>
var A={ctx:null,hum:null,salle:null,g:null,gs:null};
function audioStart(){
  if(A.ctx)return;
  try{A.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  var c=A.ctx,len=c.sampleRate*4;
  function noise(){
    var b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0),last=0;
    for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2;}
    var s=c.createBufferSource();s.buffer=b;s.loop=true;return s;
  }
  A.hum=noise();var lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=200;
  A.g=c.createGain();A.g.gain.value=0;
  A.hum.connect(lp);lp.connect(A.g);A.g.connect(c.destination);A.hum.start();
  A.salle=noise();var bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=620;bp.Q.value=.7;
  A.gs=c.createGain();A.gs.gain.value=0;
  A.salle.connect(bp);bp.connect(A.gs);A.gs.connect(c.destination);A.salle.start();
  var lfo=c.createOscillator();lfo.frequency.value=.07;
  var lg=c.createGain();lg.gain.value=380;
  lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
  A.g.gain.linearRampToValueAtTime(.045,c.currentTime+4);
  A.gs.gain.linearRampToValueAtTime(.030,c.currentTime+6);
}
function salle(v,t){if(!A.ctx)return;A.gs.gain.linearRampToValueAtTime(v,A.ctx.currentTime+(t||1));}
function fond(v,t){if(!A.ctx)return;A.g.gain.linearRampToValueAtTime(v,A.ctx.currentTime+(t||1));}
function toc(){
  if(!A.ctx)return;var c=A.ctx,t=c.currentTime;
  var o=c.createOscillator();o.type="sine";o.frequency.setValueAtTime(96,t);
  o.frequency.exponentialRampToValueAtTime(52,t+.09);
  var g=c.createGain();g.gain.setValueAtTime(.10,t);
  g.gain.exponentialRampToValueAtTime(.0008,t+.16);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.2);
}

var L1=document.getElementById("l1"),L2=document.getElementById("l2"),
    MOTS=document.getElementById("mots"),TRACE=document.getElementById("trace"),
    PORTE=document.getElementById("porte"),GLOW=document.getElementById("glow"),
    STAGE=document.getElementById("stage");

var trace=[],ecrit="",theme="",t0=0,gronde=false;

function clear(){MOTS.innerHTML="";L1.className="line";L2.className="sub";L1.textContent="";L2.textContent="";}
function dis(a,b,cb){
  clear();
  setTimeout(function(){L1.innerHTML=a;L1.classList.add("in");},120);
  if(b){setTimeout(function(){L2.innerHTML=b;L2.classList.add("in");},240);}
  if(cb)setTimeout(cb,1500);
}
function choix(liste,fn){
  MOTS.innerHTML="";t0=Date.now();
  liste.forEach(function(o,i){
    var b=document.createElement("button");
    b.className="mot";b.textContent=o[0];
    b.onclick=function(){
      var dt=Date.now()-t0;
      toc();
      if(dt<1300&&!gronde){gronde=true;vite(function(){choix(liste,fn);});return;}
      trace.push(o[0]);majTrace();
      fn(o[1]);
    };
    MOTS.appendChild(b);
    setTimeout(function(){b.classList.add("in");},260*i+300);
  });
}
function majTrace(){TRACE.textContent=trace.join("   ·   ");}
function vite(retour){
  clear();salle(.008,.6);
  setTimeout(function(){
    L1.innerHTML="Vous allez vite.";L1.classList.add("in");
    L2.innerHTML="On peut recommencer.";L2.classList.add("in");
  },200);
  setTimeout(function(){salle(.030,2);retour();},2600);
}

var Q2={
  manque:{p:"Un manque, ça se loge toujours quelque part.",o:[["dans la voix","voix"],["dans le corps","corps"],["dans le groupe","groupe"],["dans le temps","temps"]]},
  curiosite:{p:"La curiosité, c'est déjà un mouvement.",o:[["vers la scène","scene"],["vers les autres","groupe"],["vers moi","soi"],["vers un métier","voix"]]},
  autre:{p:"On arrive rarement seul.",o:[["on m'a poussé","soi"],["je viens regarder","voir"],["on travaille ensemble","groupe"],["je cherche pour quelqu'un","voir"]]},
  rien:{p:"C'est peut-être la meilleure façon d'arriver.",o:[["alors je traîne","voir"],["alors j'écoute","voir"],["alors je touche à tout","scene"]]}
};
var SORTIES={
  atelier:{p:"Vous ne venez pas apprendre à jouer.<br>Vous venez voir ce qui se passe quand vous arrêtez de vous en empêcher.",
           e:"Une fois par semaine, toute l'année, à l'heure. C'est le prix, et il n'y en a pas d'autre.",
           d:"Les ateliers",u:"index.html#ateliers/a-hebdo"},
  stage:{p:"Se mettre en jeu, c'est accepter d'être vu avant d'être prêt.",
         e:"Une semaine, tous les jours. Vous n'aurez pas le temps de vous préparer. C'est fait pour.",
         d:"Stages et créations",u:"index.html#ateliers/a-interpretation"},
  parole:{p:"Il ne s'agit pas d'apprendre à parler en public.<br>Il s'agit de devenir celui qui parle.",
          e:"Ça ne se règle pas en un après-midi, et personne ne peut le faire à votre place.",
          d:"Prise de parole",u:"index.html#ateliers/a-parole"},
  collectif:{p:"Une équipe, c'est souvent des gens qui ne se sont jamais vraiment regardés.",
             e:"Ce qui remontera ne sera pas forcément ce que vous vouliez voir. C'est à cette condition que quelque chose bouge.",
             d:"Management au présent",u:"https://managementaupresent.robertjoubin.fr/"},
  voir:{p:"Théâtre, en grec : le lieu d'où l'on regarde.<br>Ce lieu, c'est votre place dans la salle. C'est aussi votre âge, votre histoire, ce que vous avez traversé.",
        e:"Ici on ne vous demandera rien. C'est devenu rare.",
        d:"L'agenda",u:"index.html#agenda"},
  rien:{p:"Vous n'aviez peut-être rien à chercher.",
        e:"Le théâtre ne répare personne. Il rend seulement visible ce qui était déjà là.",
        d:"Un texte, simplement",u:"index.html#approche"}
};
function resoudre(th,fin){
  if(fin==="travail")return(th==="voix"||th==="soi")?"parole":"collectif";
  if(fin==="seul")return(th==="voix"||th==="soi")?"parole":(th==="voir"?"rien":"stage");
  if(fin==="autres")return(th==="scene")?"stage":"atelier";
  return(th==="voir")?"voir":"rien";
}

function vitrine(){
  clear();TRACE.textContent="";trace=[];gronde=false;
  setTimeout(function(){
    L1.innerHTML="Il y a une lumière allumée.";L1.classList.add("in");
    L2.innerHTML="Personne ne vous a rien demandé.";L2.classList.add("in");
  },600);
  setTimeout(function(){PORTE.classList.add("in");},4000);
  PORTE.onclick=function(){try{localStorage.setItem("seuil-passe","1");}catch(e){}};
  setTimeout(seuil,4200);
}
function seuil(){
  MOTS.innerHTML="";
  var b=document.createElement("button");b.id="pousser";b.textContent="pousser";
  var w=document.createElement("div");w.id="barre";var f=document.createElement("i");w.appendChild(f);
  MOTS.appendChild(b);MOTS.appendChild(w);
  b.classList.add("mot");setTimeout(function(){b.classList.add("in");w.style.opacity=1;},300);
  var t=null,p=0,fini=false;
  function finir(){
    if(fini)return;fini=true;
    if(t){clearInterval(t);t=null;}
    f.style.transition="width .35s ease";f.style.width="100%";
    setTimeout(ouvrir,380);
  }
  function down(e){
    if(fini)return;
    e.preventDefault();audioStart();
    if(t)return;
    t=setInterval(function(){
      p+=3.2;f.style.width=Math.min(p,100)+"%";
      if(p>=100)finir();
    },16);
  }
  function up(){
    if(fini||!t)return;
    clearInterval(t);t=null;
    finir();
  }
  b.addEventListener("pointerdown",down);
  window.addEventListener("pointerup",up);
  window.addEventListener("pointercancel",up);
  b.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();audioStart();finir();}
  });
}
function ouvrir(){
  GLOW.classList.add("on");toc();
  dis("Bonsoir.","Vous êtes entré. Il n'y a rien à acheter ici.",function(){
    setTimeout(accueil,600);
  });
}
function accueil(){
  dis("Qu'est-ce que vous cherchez ?","",function(){
    setTimeout(function(){
      dis("Quelque chose vous a amené ici.","",function(){
        choix([["un manque","manque"],["une curiosité","curiosite"],["quelqu'un d'autre","autre"],["rien de précis","rien"]],q2);
      });
    },500);
  });
}
function q2(k){
  var s=Q2[k];
  dis(s.p,"",function(){choix(s.o,function(th){theme=th;ecrire();});});
}
function ecrire(){
  salle(0,.5);fond(.012,1.5);
  clear();
  setTimeout(function(){
    L1.innerHTML="Maintenant, dites-le.";L1.classList.add("in");
    L2.innerHTML="Finissez la phrase. Une ligne, même maladroite — ce n'est pas un formulaire, personne ne la lira. Mais tant qu'elle n'est pas écrite, elle reste vague.";L2.classList.add("in");
    var row=document.createElement("div");row.id="amorce";
    var pre=document.createElement("span");pre.id="prefixe";pre.textContent="Ce que je cherche, c'est";
    var i=document.createElement("input");i.id="champ";i.type="text";i.setAttribute("aria-label","finissez la phrase : ce que je cherche, c'est");
    row.appendChild(pre);row.appendChild(i);
    var e=document.createElement("p");e.id="err";
    var v=document.createElement("button");v.className="mot";v.id="valider";v.textContent="c'est écrit";
    v.style.marginTop="1.4rem";
    MOTS.appendChild(row);MOTS.appendChild(e);MOTS.appendChild(v);
    setTimeout(function(){i.focus();},400);
    function suite(){
      if(i.value.trim().length<4){e.textContent="allez jusqu'au bout de la phrase";i.focus();return;}
      ecrit=i.value.trim();toc();
      salle(.030,3);fond(.045,3);
      q3();
    }
    i.addEventListener("input",function(){
      e.textContent="";
      if(i.value.trim().length>=4)v.classList.add("in");else v.classList.remove("in");
    });
    i.addEventListener("keydown",function(ev){if(ev.key==="Enter"){ev.preventDefault();suite();}});
    v.addEventListener("click",suite);
  },900);
}
function q3(){
  dis("Et ça se passerait…","",function(){
    choix([["seul","seul"],["avec d'autres","autres"],["là où je travaille","travail"],["je ne sais pas encore","flou"]],function(f){
      envers(resoudre(theme,f));
    });
  });
}
function envers(k){
  salle(0,2);fond(.02,2);GLOW.classList.remove("on");
  clear();
  setTimeout(function(){
    L1.innerHTML="Avant d'aller plus loin.";L1.classList.add("in");
    L2.innerHTML="Rien de ce qui est proposé ici ne va régler quoi que ce soit. Le théâtre est un outil. Un stage est un outil. Un atelier est un outil.<br><br>Un outil au service de quoi, au fait ?";
    L2.classList.add("in");
  },400);
  setTimeout(function(){
    choix([["je continue","go"]],function(){salle(.022,3);fond(.045,3);sortie(k);});
  },5200);
}
function sortie(k){
  try{localStorage.setItem("seuil-passe","1");}catch(e){}
  var s=SORTIES[k];
  clear();GLOW.classList.add("on");
  setTimeout(function(){L1.innerHTML=s.p;L1.classList.add("in");},300);
  setTimeout(function(){
    var e=document.createElement("p");e.className="envers";e.textContent=s.e;
    var a=document.createElement("a");a.id="sortiePorte";a.href=s.u;a.textContent=s.d;
    if(s.u.indexOf("http")===0){a.target="_blank";a.rel="noopener";}
    var sg=document.createElement("p");sg.id="signature";
    sg.innerHTML="vous êtes passé par : "+trace.join(" · ")+
      "<br>vous avez écrit : ce que je cherche, c'est "+ecrit.replace(/</g,"&lt;")+
      "<br><br>Vous n'avez peut-être pas trouvé. Vous avez cherché.<br>C'est déjà quelque chose que vous savez de vous.";
    var r=document.createElement("button");r.id="reprendre";r.textContent="ressortir";
    r.onclick=function(){location.reload();};
    MOTS.appendChild(e);MOTS.appendChild(a);MOTS.appendChild(sg);MOTS.appendChild(r);
    TRACE.textContent="";
    setTimeout(function(){e.classList.add("in");a.classList.add("in");sg.classList.add("in");r.classList.add("in");},60);
  },900);
}
vitrine();
</script>
</body>
</html>
